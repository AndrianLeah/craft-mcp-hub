name: Something doesn't work
description: An app doesn't connect or isn't found, or the hub does something wrong
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: System
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `crafthub --version`
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `crafthub doctor <app>`
      description: It lists file paths from your computer, so read it before posting. The access token is never in it.
      render: text
  - type: textarea
    id: list
    attributes:
      label: Output of `crafthub list`
      render: text
