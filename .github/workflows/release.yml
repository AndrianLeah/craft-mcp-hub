name: Release

# Pushing a tag like v0.5.0 builds the programs for every system and publishes a release with
# them. The release stays a draft until every build is attached, so the install scripts, which
# take the latest release, never find one with files missing.
#
# Run by hand (Actions → Release → Run workflow), it is a dry run: every system is built and
# attested, and the files are kept with the run, but no release is created and no tag pushed.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Each job asks for what it needs on top of this.
permissions:
  contents: read

jobs:
  draft:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Actions are pinned to a commit, so what runs can't change under a tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check that the tag is the version in Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME but Cargo.toml says $version."
            exit 1
          fi
      - name: Take this version's notes from the changelog
        run: |
          awk -v version="${GITHUB_REF_NAME#v}" '/^## / { if (found) exit; found = ($2 == version); next } found' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for ${GITHUB_REF_NAME#v}."
            exit 1
          fi
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --notes-file notes.md

  build:
    needs: draft
    # A dry run has no draft to wait for.
    if: ${{ !cancelled() && (needs.draft.result == 'success' || github.event_name == 'workflow_dispatch') }}
    permissions:
      contents: write # attach the files to the release
      id-token: write # sign the attestations
      attestations: write # store them with the repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: windows-x86_64 }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc, name: windows-aarch64 }
          - { os: macos-latest, target: aarch64-apple-darwin, name: macos-aarch64 }
          - { os: macos-latest, target: x86_64-apple-darwin, name: macos-x86_64 }
          # The oldest Ubuntu there is a runner for, so the builds run on older systems too.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, name: linux-x86_64 }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, name: linux-aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        shell: bash
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }} --no-self-update && rustup default stable
      - name: Install what the panel needs to build (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - run: cargo build --locked --release --target ${{ matrix.target }}
      # build.rs puts the icon and the version details in together, and only warns when it can't.
      - name: Check that the programs have their icon (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($name in 'crafthub.exe', 'crafthub-panel.exe') {
            $info = (Get-Item "target/${{ matrix.target }}/release/$name").VersionInfo
            if ($info.ProductName -ne 'Craft MCP Hub') {
              Write-Error "$name has no icon or version details: build.rs could not put them in."
              exit 1
            }
          }
      - name: Package (macOS, Linux)
        if: runner.os != 'Windows'
        run: tar -czf crafthub-${{ matrix.name }}.tar.gz -C target/${{ matrix.target }}/release crafthub crafthub-panel
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/${{ matrix.target }}/release/crafthub.exe, target/${{ matrix.target }}/release/crafthub-panel.exe -DestinationPath crafthub-${{ matrix.name }}.zip
      # The install scripts check the download against this before installing anything.
      - name: Add the checksum
        id: package
        shell: bash
        run: |
          file=$(ls crafthub-${{ matrix.name }}.*)
          if command -v sha256sum >/dev/null 2>&1; then sha256sum "$file" > "$file.sha256"; else shasum -a 256 "$file" > "$file.sha256"; fi
          cat "$file.sha256"
          echo "file=$file" >> "$GITHUB_OUTPUT"
      # A signed record that this workflow built the file from this commit, which anyone can
      # check with `gh attestation verify` (see the README's Security section). Unlike the
      # checksum, it doesn't come from the release, so a file changed there afterwards fails it.
      - name: Attest where the file was built
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.file }}
      - name: Attach to the release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" crafthub-${{ matrix.name }}.* --clobber
      - name: Keep the files with the run (dry run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crafthub-${{ matrix.name }}
          path: crafthub-${{ matrix.name }}.*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
