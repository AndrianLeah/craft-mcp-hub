name: CI

on:
  push:
    branches: [main]
  pull_request:

# The checks only read the code.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Actions are pinned to a commit, so what runs can't change under a tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        shell: bash
        run: rustup toolchain install stable --profile minimal --component clippy --no-self-update && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install what the panel needs to build (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - run: cargo build --locked
      # Also the end-to-end tests (tests/e2e): the real crafthub, its server and the bridge AI
      # clients launch, against a stand-in engine. They start programs of their own, so a hang
      # is cut short rather than left to run for hours.
      - run: cargo test --locked
        timeout-minutes: 15
      - run: cargo clippy --locked --all-targets -- -D warnings
      # Into a folder of its own: the runner's own app menu and programs are left alone.
      - name: Check the app menu entry (Linux)
        if: runner.os == 'Linux'
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/share
          CRAFTHUB_HOME: ${{ runner.temp }}/crafthub
          CRAFTHUB_INSTALL_DIR: ${{ runner.temp }}/bin
        run: |
          sudo apt-get install -y desktop-file-utils
          target/debug/crafthub install-app
          cat "$XDG_DATA_HOME/applications/craft-mcp-hub.desktop"
          desktop-file-validate "$XDG_DATA_HOME/applications/craft-mcp-hub.desktop"
          test "$(find "$XDG_DATA_HOME/icons/hicolor" -name craft-mcp-hub.png | wc -l)" -eq 10
          target/debug/crafthub uninstall --yes
          test ! -e "$XDG_DATA_HOME/applications/craft-mcp-hub.desktop"
          test -z "$(find "$XDG_DATA_HOME/icons/hicolor" -name craft-mcp-hub.png)"
      - name: Check the install script (macOS, Linux)
        if: runner.os == 'Linux'
        run: shellcheck install.sh
      - name: Check the install script (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$null, [ref]$errors)
          if ($errors) { $errors | ForEach-Object { Write-Error $_.ToString() }; exit 1 }
