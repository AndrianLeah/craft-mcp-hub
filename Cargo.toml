[package]
name = "craft-mcp-hub"
version = "0.7.0"
edition = "2021"
description = "Unofficial MCP hub for the ArtCraft app suite: one shared, windowless MCP server per app, for every AI client session."
license = "MIT"
repository = "https://github.com/AndrianLeah/craft-mcp-hub"
default-run = "crafthub"

[lib]
name = "crafthub"
path = "src/lib.rs"

# The command-line tool: also the shared server and the bridge AI clients launch.
[[bin]]
name = "crafthub"
path = "src/bin/crafthub.rs"

# The control panel window. Separate so the command-line tool stays small and needs no display.
[[bin]]
name = "crafthub-panel"
path = "src/bin/crafthub-panel.rs"
required-features = ["panel"]

# The real crafthub against a stand-in engine. The test program is also that engine, so it is
# built with the tests and never ships; it has a runner of its own, because the standard one
# prints to stdout, which the engine needs for MCP.
[[test]]
name = "e2e"
path = "tests/e2e/main.rs"
harness = false

[features]
default = ["panel"]
panel = ["dep:eframe", "dep:png", "dep:rfd", "dep:sys-locale"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
# preserve_order: a client's settings file is written back with its keys in the order they were in.
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
# Edits Codex's settings in place, keeping its comments and layout.
toml_edit = "0.22"
# The same for settings in JSON with comments (Zed's): reads them, and edits one entry in place.
jsonc-parser = { version = "0.34", features = ["cst", "serde"] }
getrandom = "0.3"
# Checks the ArtCraft launcher catalog's signature, with the same crates as the launcher. Without
# their default features: verifying one signature needs neither the standard library nor tables.
ed25519-dalek = { version = "2.2", default-features = false }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
eframe = { version = "0.31", optional = true }
png = { version = "0.17", optional = true }
# The panel's folder and file pickers: the system's own dialogs (on Linux through the desktop
# portal, with libdbus loaded when one opens).
rfd = { version = "0.17", optional = true }
# The system's language, for the panel's.
sys-locale = { version = "0.3", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
# Puts the icon and version details into the Windows programs.
winresource = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
