<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Craft MCP Hub: a hub and the apps on its spokes. One flat shape, two colours, no effects.
       The mark keeps about 12% of the canvas clear on every side and no part of it is thinner
       than 5 units, so it survives being drawn small. Rendered by examples/make_icons.rs. -->
  <rect x="2" y="2" width="60" height="60" rx="13" fill="#111214"/>
  <g stroke="#FFFFFF" stroke-width="5" stroke-linecap="round">
    <line x1="32" y1="33.5" x2="32" y2="14.5"/>
    <line x1="32" y1="33.5" x2="50.07" y2="27.63"/>
    <line x1="32" y1="33.5" x2="43.17" y2="48.87"/>
    <line x1="32" y1="33.5" x2="20.83" y2="48.87"/>
    <line x1="32" y1="33.5" x2="13.93" y2="27.63"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="32" cy="14.5" r="5.5"/>
    <circle cx="50.07" cy="27.63" r="5.5"/>
    <circle cx="43.17" cy="48.87" r="5.5"/>
    <circle cx="20.83" cy="48.87" r="5.5"/>
    <circle cx="13.93" cy="27.63" r="5.5"/>
    <circle cx="32" cy="33.5" r="9.5"/>
  </g>
  <circle cx="32" cy="33.5" r="4" fill="#111214"/>
</svg>
