# The control panel in Italian.
#
# To translate the panel into another language, copy this file to the hub's `lang` folder as
# `<code>.toml` (`de.toml` for German: the code is the language's two letters), set `name`, and
# replace each translation on the right. The English on the left stays as it is. Words in braces,
# such as {name}, are filled in by the panel: keep them, wherever the sentence needs them. A line
# left out is shown in English. The README says where the `lang` folder is.

name = "Italiano"

[text]
